name: Build Phong Voice One APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Verify public repo has no bundled voice recording
        run: |
          if find app -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.opus' -o -iname '*.b64' \) | grep -q .; then
            echo "ERROR: Voice recordings must not be committed to public GitHub."
            exit 1
          fi
      - name: Compile APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Validate APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhongVoice-One-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
